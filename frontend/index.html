<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="PlaneAI: asistente para planear la matrícula de Ingeniería de Sistemas en la Universidad de Antioquia. Malla interactiva, cargas sin choques y asistente conversacional."
    />
    <meta name="theme-color" content="#006B3C" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E1813" media="(prefers-color-scheme: dark)" />
    <meta property="og:title" content="PlaneAI · UdeA" />
    <meta property="og:description" content="Arma tu matrícula sobre la malla real de Ingeniería de Sistemas." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&display=swap"
      rel="stylesheet"
    />
    <title>PlaneAI · UdeA</title>
    <script>
      // Aplica el tema guardado antes de pintar, para evitar el destello de tema incorrecto.
      try {
        var t = JSON.parse(localStorage.getItem("planeai:tema") || "null");
        if (t === "claro" || t === "oscuro") document.documentElement.dataset.tema = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
